<!DOCTYPE html>
<html>
<head>
<title>Sikarwar Sweets</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #eaeded;
}

/* NAVBAR */
.navbar {
    background: #131921;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* PRODUCTS */
.products {
    padding: 20px;
    text-align: center;
}

.product-card {
    background: white;
    padding: 15px;
    margin: 10px;
    display: inline-block;
    width: 250px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.product-card img {
    width: 100%;
    border-radius: 10px;
}
</style>

</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Sikarwar Sweets</h2>
    <div>Home | Menu | Contact</div>
</div>

<!-- PRODUCTS -->
<div class="products">

    <div class="product-card">
        <img src="https://images.unsplash.com/photo-1601050690597-df0568f70950" alt="Sweets Image">
        <h3>Fresh Sweets</h3>
        <p>Delicious Indian traditional sweets</p>
    </div>

</div>

</body>
</html>
