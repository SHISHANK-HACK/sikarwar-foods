<!DOCTYPE html>
<html>
<head>
<title>Sikarwar Sweets</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #eaeded;
}

/* NAVBAR */
.navbar {
    background: #131921;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
}

/* PRODUCTS */
.products {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
    padding: 20px;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 5px;
    text-align: center;
}

button {
    background: #ffd814;
    border: none;
    padding: 8px;
    cursor: pointer;
}

/* CART */
.cart {
    position: fixed;
    right: 0;
    top: 60px;
    width: 300px;
    background: white;
    height: 100%;
    padding: 10px;
    overflow-y: auto;
}

input {
    width: 100%;
    padding: 5px;
    margin: 5px 0;
}
</style>
</head>

<body>

<div class="navbar">
    <div>🍬 Sikarwar Sweets</div>
    <div>Cart 🛒 (<span id="count">0</span>)</div>
</div>

<div class="products" id="products"></div>

<div class="cart">
    <h3>Cart</h3>
    <div id="cart-items"></div>
    <h4>Total: ₹<span id="total">0</span></h4>

    <h4>Checkout</h4>
    <input id="name" placeholder="Your Name">
    <input id="address" placeholder="Address">
    <input id="phone" placeholder="Phone Number">

    <button onclick="placeOrder()">Place Order</button>
</div>

<script>
let products = [
{name:"Gulab Jamun",price:200},
{name:"Rasgulla",price:180},
{name:"Kaju Katli",price:800},
{name:"Ladoo",price:150},
{name:"Barfi",price:300},
{name:"Jalebi",price:120},
{name:"Milk Cake",price:400},
{name:"Soan Papdi",price:250},
{name:"Peda",price:220},
{name:"Imarti",price:160},
{name:"Halwa",price:200},
{name:"Khoya Sweet",price:350}
];

let cart = [];

function showProducts(){
let html="";
products.forEach((p,i)=>{
html+=`
<div class="card">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button onclick="add(${i})">Add to Cart</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

function add(i){
let item=products[i];
let found=cart.find(c=>c.name===item.name);

if(found){
found.qty++;
}else{
cart.push({...item,qty:1});
}
update();
}

function update(){
let total=0;
let html="";
cart.forEach((item,i)=>{
total+=item.price*item.qty;

html+=`
<div>
${item.name} x${item.qty} = ₹${item.price*item.qty}
<button onclick="change(${i},1)">+</button>
<button onclick="change(${i},-1)">-</button>
</div>`;
});

document.getElementById("cart-items").innerHTML=html;
document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

function change(i,val){
cart[i].qty+=val;
if(cart[i].qty<=0) cart.splice(i,1);
update();
}

function placeOrder(){
let name=document.getElementById("name").value;
let address=document.getElementById("address").value;
let phone=document.getElementById("phone").value;

if(!name || !address || !phone){
alert("Fill all details");
return;
}

let message = "New Order - Sikarwar Sweets%0A";
message += "Name: "+name+"%0A";
message += "Address: "+address+"%0A";
message += "Phone: "+phone+"%0A%0A";

cart.forEach(item=>{
message += item.name+" x"+item.qty+" = ₹"+(item.price*item.qty)+"%0A";
});

let total = cart.reduce((sum,item)=>sum+(item.price*item.qty),0);
message += "%0ATotal: ₹"+total;

// 🔥 CHANGE THIS NUMBER
let url = "https://wa.me/9911132308?text="+message;

window.open(url,"_blank");
}

showProducts();
</script>

</body>
</html>
